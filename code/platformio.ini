[platformio]
src_dir = .

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    madhephaestus/ESP32Servo

; To flash via native USB-CDC, put the board into bootloader mode (BOOT+RESET) and select the matching COM port.
