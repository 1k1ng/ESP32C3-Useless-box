[platformio]
src_dir = .

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    madhephaestus/ESP32Servo

; Wenn du per nativer USB-CDC flashen willst, stelle sicher, dass das Board im Bootloader ist (BOOT+RESET) und w?hle den passenden COM-Port.
